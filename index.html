<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pesquisa de Satisfação</title>
</head>

<body>
    <header>
        <h1>Pesquisa de Satisfação para UPNewTec<h1>
    </header>
    <section>
        <fieldset>
            <legend>Formúlario Pessoal para a Pesquisa de Satisfação</legend>
            <form action="" method="get">
                <label for="name">Nome completo:</label>
                <input id="name" type="text" name="userName" placeholder="Nome completo" required>
                <br>
                <label for="age">Idade:</label>
                <input id="age" type="number" name="userAge" min="12" ; max="99" placeholder="Mínimo 12 anos e máximo 99">
                <br>
                        <label for="birthDate">Data de nascimento:<label>
                        <input id="birthDate" type="birthDate" name="userBirthDate">
                        <br>
                        <label for="email">E-mail</label>
                        <input id="email" type="email" name="userEmail" required>
                        <br>
                        <label for="phoneNumber">Telefone:</label>
                        <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}"
                            placeholder="DDD+Número Somente números">
                        <br>
                        <label for="image">Foto de perfil:</label>
                        <input id="image" type="file" name="userImage" accept="image/*">
        </fieldset>
        <fieldset>
            <form action="" method="get">
                <legend>Dados de Perfil</legend>
                <input id="Masculino" type="radio" name="genderUser">
                <label for="Masculino">Masculino</label>

                <input id="Feminino" type="radio" name="genderUser">
                <label for="Feminino">Feminino</label>

                <input id="notInformed" type="radio" name="genderUser">
                <label for="notInformed">Prefiro não informar</label>
                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed"> </option>
                    <option value="Solteiro">Solteiro</option>
                    <option value="Casado">Casado</option>
                    <option value="Casado">União estável</option>
                </select>
                <label for="state">Estado de nascimento:</label>
                <select id="state" name="userState" required>
                    <option value="    "> </option>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distrito-federal">Distrito Federal</option>
                    <option value="espirito-santo">Espírito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="mato-grosso">Mato Grosso</option>
                    <option value="mato-grosso-do-sul">Mato Grosso do Sul</option>
                    <option value="minas-gerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rio-de-janeiro">Rio de Janeiro</option>
                    <option value="rio-grande-do-norte">Rio Grande do Norte</option>
                    <option value="rio-grande-do-sul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santa-catarina">Santa Catarina</option>
                    <option value="sao-paulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <label for="city">Cidade:</label>
                <input type="text" id="city" name="userCity" autocomplete="address-level2"
                    placeholder="Ex.: Fortaleza" />
            </form>
        </fieldset>

        <fieldset>
            <legend>Hábitos</legend>
            <p>Redes sociais:</p>
            <input id="Facebook" type="checkbox">
            <label for="Facebook">Facebook</label>
            <input id="Instagram" type="checkbox">
            <label for="Instagram">Instagram</label>
            <input id="Linkedin" type="checkbox">
            <label for="Linkedin">Linkedin</label>     
            <input id="X" type="checkbox">
            <label for="X">X</label>
            <br>
            <label for="favoriteColor">Cor favorita</label>
            <input type="color" name="userFavoriteColor" id="favoriteColor">
        </fieldset>

        <fieldset>
            <legend>Opiniões</legend>
            <p>Nos ajude a melhor, qual a melhor opção descreve a sua satisfação?</p>
            <input type="radio" id="Ótima" name="userSatisfaction">
            <label for="Ótima">Ótima</label>
            <input type="radio" id="Boa" name="userSatisfaction">
            <label for="Boa">Boa</label>
            <input type="radio" id="Regular" name="userSatisfaction">
            <label for="Regular">Regular</label>
            <input type="radio" id="Ruim" name="userSatisfaction">
            <label for="Ruim" id="Satisfaction"">Ruim</label>
            <br>
            <label for="Comment">Forneça mais detalhes de sua opinião:</label>
            <textarea name="userComment" id="Comment" placeholder="Campo para se expressar aqui..."></textarea>
        </fieldset>
        <button type="submit">Enviar</button>
    </section>
    </form>

</body>

</html>
